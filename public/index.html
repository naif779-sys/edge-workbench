<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edge Workbench | منصة التشييد والاستشارة المعمارية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    button, input, textarea { touch-action: manipulation; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-slate-950">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 font-bold text-xl shadow-inner">
        ⚡
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-base font-bold text-white tracking-wide">Edge Workbench</h1>
          <span id="archetypeBadge" class="hidden px-2 py-0.5 rounded text-[11px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/30"></span>
        </div>
        <p class="text-xs text-slate-400 mt-0.5">محرك التشييد والاستشارة المعمارية عند الحافة</p>
      </div>
    </div>

    <!-- API Key & Status -->
    <div class="flex items-center gap-2">
      <input type="password" id="customApiKey" placeholder="مفتاح OpenRouter (اختياري)" 
             onchange="saveApiKey(this.value)"
             class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500 w-44 md:w-60 transition">
      <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800/80 text-slate-300 border border-slate-700">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> نشط
      </span>
    </div>
  </header>

  <!-- Main Grid Workspace -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 p-4 max-w-[1800px] w-full mx-auto">
    
    <!-- Left Workspace Panel (Discussion & Analysis) -->
    <section class="lg:col-span-5 flex flex-col gap-4">
      
      <!-- Input Box -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col gap-3 shadow-sm">
        <div class="flex items-center justify-between">
          <label class="text-xs font-bold text-slate-200 flex items-center gap-1.5">
            <span>💬</span> متطلبات المشروع والحوار الاستشاري
          </label>
          <span class="text-[11px] text-slate-400">تحليل المراجع والأصول</span>
        </div>

        <textarea id="promptInput" rows="3" 
                  oninput="updateLiveTokenEstimate()"
                  placeholder="صف مشروعك، أو ارفع صوراً استرشادية وأصولاً للفرز والاستشارة المعمارية..."
                  class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs md:text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 custom-scroll resize-none leading-relaxed"></textarea>
        
        <input type="file" id="imageInput" multiple accept="image/*" class="hidden" onchange="handleImageSelection(event)">

        <!-- Action Bar (Tablet-Optimized Touch Target >= 44px) -->
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button onclick="document.getElementById('imageInput').click()" 
                  class="min-h-[44px] bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 font-bold py-2 px-3 rounded-lg text-xs border border-slate-700 transition flex items-center justify-center gap-1.5">
            <span>🖼️</span> إرفاق الصور والمراجع
          </button>

          <button id="btnConsult" onclick="consultAndAnalyze()" 
                  class="min-h-[44px] bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white font-bold py-2 px-3 rounded-lg text-xs transition flex items-center justify-center gap-1.5 shadow-sm">
            <span>👁️</span> استشارة وفرز بصري
          </button>
        </div>

        <!-- Thumbnails Container -->
        <div id="imagePreviewContainer" class="flex gap-2 overflow-x-auto py-1 custom-scroll hidden border-t border-slate-800 pt-2"></div>
      </div>

      <!-- Architectural Log & QA Screen -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex-1 flex flex-col gap-3 min-h-[340px] shadow-sm">
        <div class="flex items-center justify-between">
          <label class="text-xs font-bold text-slate-200 flex items-center gap-1.5">
            <span>🧠</span> شاشة الاستيعاب والاستشارة المعمارية
          </label>
          <span id="analysisStatus" class="text-xs text-slate-400">بانتظار المدخلات...</span>
        </div>
        
        <div id="analysisLog" 
             class="w-full flex-1 bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-300 custom-scroll overflow-y-auto leading-relaxed space-y-2.5 font-sans">
          <p class="text-slate-500 italic">ستظهر هنا تفاصيل الفرز البصري، تحليل الهيكل المرجعي، واستشارة المستشار المعماري...</p>
        </div>
        
        <!-- Bottom Action Bar (Token Estimate & Construction) -->
        <div class="grid grid-cols-12 gap-2 pt-1">
          <button id="btnEstimate" onclick="estimateBuildTokens()" 
                  class="col-span-5 min-h-[44px] bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold py-2 px-2 rounded-lg text-xs border border-slate-700 transition flex items-center justify-center gap-1">
            <span>📊</span> <span id="estimateBtnLabel">~0 توكن</span>
          </button>

          <button id="btnBuild" onclick="buildProject()" disabled
                  class="col-span-7 min-h-[44px] bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold py-2 px-3 rounded-lg text-xs transition flex items-center justify-center gap-1.5 shadow-sm">
            <span>🚀</span> تشييد الواجهة المعمارية
          </button>
        </div>
      </div>
    </section>

    <!-- Right Workspace Panel (Preview & Source Code) -->
    <section class="lg:col-span-7 flex flex-col bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-sm">
      
      <!-- Toolbar -->
      <div class="bg-slate-900/90 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <button id="tabPreview" onclick="switchTab('preview')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white">معاينة حية</button>
          <button id="tabCode" onclick="switchTab('code')" class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white">الكود المصدري</button>
          <button id="tabBlueprint" onclick="switchTab('blueprint')" class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white">📐 المخطط الهيكلي (JSON)</button>
        </div>
        
        <div class="flex items-center gap-2">
          <button onclick="downloadCode()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1">
            📥 تحميل HTML
          </button>
        </div>
      </div>

      <!-- View Area -->
      <div class="flex-1 relative bg-slate-950 flex flex-col min-h-[500px]">
        <iframe id="liveFrame" class="w-full h-full flex-1 border-none bg-white"></iframe>
        
        <textarea id="codeView" readonly 
                  class="hidden w-full h-full flex-1 bg-slate-950 text-emerald-400 font-mono text-xs p-4 focus:outline-none custom-scroll resize-none"
                  placeholder="سيظهر الكود المصدري الخفيف هنا بعد التشييد..."></textarea>

        <textarea id="blueprintView" 
                  oninput="updateLiveTokenEstimate()"
                  class="hidden w-full h-full flex-1 bg-slate-950 text-amber-400 font-mono text-xs p-4 focus:outline-none custom-scroll resize-none"
                  placeholder="كائن المخطط الهيكلي البرمجي (JSON Blueprint)..."></textarea>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="hidden absolute inset-0 bg-slate-950/85 backdrop-blur-sm flex flex-col items-center justify-center gap-3 z-20">
          <div class="w-9 h-9 border-3 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
          <p id="loadingText" class="text-sm font-medium text-slate-300">جارٍ المعالجة...</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    let currentHtmlCode = "";
    let currentBlueprint = null;
    let uploadedImages = [];
    let imageTokensCount = 0;
    let conversationHistory = [];
    let lastDetectedError = null;

    document.addEventListener("DOMContentLoaded", () => {
      const savedKey = localStorage.getItem("EDGE_WORKBENCH_API_KEY");
      if (savedKey) document.getElementById("customApiKey").value = savedKey;
      updateLiveTokenEstimate();
    });

    function saveApiKey(key) {
      if (key) localStorage.setItem("EDGE_WORKBENCH_API_KEY", key.trim());
      else localStorage.removeItem("EDGE_WORKBENCH_API_KEY");
    }

    function getApiKey() {
      return document.getElementById("customApiKey").value.trim() || localStorage.getItem("EDGE_WORKBENCH_API_KEY") || "";
    }

    function setLoader(show, text = "") {
      const overlay = document.getElementById("loadingOverlay");
      const label = document.getElementById("loadingText");
      if (show) {
        label.innerText = text;
        overlay.classList.remove("hidden");
      } else {
        overlay.classList.add("hidden");
      }
    }

    function switchTab(tab) {
      const frame = document.getElementById("liveFrame");
      const code = document.getElementById("codeView");
      const bp = document.getElementById("blueprintView");
      const tabP = document.getElementById("tabPreview");
      const tabC = document.getElementById("tabCode");
      const tabB = document.getElementById("tabBlueprint");

      frame.classList.add("hidden");
      code.classList.add("hidden");
      bp.classList.add("hidden");
      tabP.className = "px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white";
      tabC.className = "px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white";
      tabB.className = "px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white";

      if (tab === 'preview') {
        frame.classList.remove("hidden");
        tabP.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white";
      } else if (tab === 'code') {
        code.classList.remove("hidden");
        tabC.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white";
      } else if (tab === 'blueprint') {
        bp.classList.remove("hidden");
        tabB.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white";
      }
    }

    function compressImage(file, maxWidth = 1024, quality = 0.7) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            const imgTokens = Math.ceil((width * height) / 750);
            resolve({ base64: canvas.toDataURL("image/jpeg", quality), tokens: imgTokens });
          };
        };
      });
    }

    async function handleImageSelection(event) {
      const files = event.target.files;
      if (!files.length) return;

      const container = document.getElementById("imagePreviewContainer");
      container.classList.remove("hidden");

      for (let file of Array.from(files)) {
        const result = await compressImage(file, 1024, 0.7);
        uploadedImages.push({ base64: result.base64, tokens: result.tokens });
        imageTokensCount += result.tokens;

        const thumb = document.createElement("div");
        thumb.className = "relative w-14 h-14 rounded-lg overflow-hidden border border-slate-700 shrink-0";
        thumb.innerHTML = `
          <img src="${result.base64}" class="w-full h-full object-cover">
          <button onclick="removeImage(this, '${result.base64}', ${result.tokens})" class="absolute top-0.5 right-0.5 bg-rose-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px] leading-none">×</button>
        `;
        container.appendChild(thumb);
      }
      updateLiveTokenEstimate();
    }

    function removeImage(btn, base64, tokens) {
      btn.parentElement.remove();
      uploadedImages = uploadedImages.filter(img => img.base64 !== base64);
      imageTokensCount = Math.max(0, imageTokensCount - tokens);
      if (uploadedImages.length === 0) {
        document.getElementById("imagePreviewContainer").classList.add("hidden");
      }
      updateLiveTokenEstimate();
    }

    function updateLiveTokenEstimate() {
      const prompt = document.getElementById("promptInput").value || "";
      const bp = document.getElementById("blueprintView").value || "";
      const textTokens = Math.ceil((prompt.length + bp.length) / 2.8);
      const total = textTokens + imageTokensCount;
      const cost = (total / 1000000) * 2.0;
      document.getElementById("estimateBtnLabel").innerText = `~${total} توكن ($${cost.toFixed(4)})`;
    }

    function estimateBuildTokens() {
      const prompt = document.getElementById("promptInput").value || "";
      const bp = document.getElementById("blueprintView").value || "";
      const inputTokens = Math.ceil((prompt.length + bp.length) / 2.8) + imageTokensCount;
      const expectedOutputTokens = 3500;
      const totalTokens = inputTokens + expectedOutputTokens;
      const cost = ((inputTokens * 2.00) + (expectedOutputTokens * 8.00)) / 1000000;

      alert(`📊 تقدير الاستهلاك والتكلفة (Claude Sonnet 5):\n` +
            `• توكن المدخلات: ${inputTokens.toLocaleString()} توكن\n` +
            `• توكن الشفرة المتوقعة: ~${expectedOutputTokens.toLocaleString()} توكن\n` +
            `• إجمالي العملية: ~${totalTokens.toLocaleString()} توكن\n` +
            `• التكلفة التقديرية الإجمالية: ~$${cost.toFixed(4)}`);
    }

    function logMessage(title, contentHtml, type = "normal") {
      const log = document.getElementById("analysisLog");
      const entry = document.createElement("div");
      let borderClass = "bg-slate-900/90 border-slate-800 text-slate-200";
      let titleClass = "text-amber-400";

      if (type === "success") {
        borderClass = "bg-emerald-950/30 border-emerald-800/40 text-emerald-200";
        titleClass = "text-emerald-400";
      } else if (type === "error") {
        borderClass = "bg-rose-950/30 border-rose-800/40 text-rose-200";
        titleClass = "text-rose-400";
      }

      entry.className = `p-3 rounded-lg border text-xs leading-relaxed ${borderClass}`;
      entry.innerHTML = `<div class="font-bold mb-1.5 text-[11px] ${titleClass}">${title}</div><div>${contentHtml}</div>`;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    }

    // --- Quality Gate Linter ---
    function runQualityGate(htmlCode) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlCode, "text/html");
      const checks = [];

      checks.push({ label: "الاتجاه العربي واللغة (dir='rtl')", pass: doc.documentElement.getAttribute("dir") === "rtl" });
      checks.push({ label: "التجاوب مع الشاشات (Viewport)", pass: !!doc.querySelector("meta[name='viewport']") });
      checks.push({ label: "مكتبة Tailwind CSS", pass: Array.from(doc.scripts).some(s => s.src && s.src.includes("tailwindcss")) });
      checks.push({ label: "تكامل التفاعلات ومنطق الواجهة", pass: htmlCode.includes("<script") && htmlCode.includes("addEventListener") });

      const allPassed = checks.every(c => c.pass);
      let reportHtml = `<div class="space-y-1 my-1">` + 
        checks.map(c => `<div>${c.pass ? '✅' : '⚠️'} <span class="${c.pass ? 'text-slate-300' : 'text-amber-400'}">${c.label}</span></div>`).join('') +
        `</div>`;

      if (allPassed) {
        logMessage("🛡️ تقرير فحص الجودة (Quality Gate)", reportHtml + `<div class="text-emerald-400 font-bold mt-1">اجتاز الكود كافة معايير البناء القياسية.</div>`, "success");
      } else {
        logMessage("⚠️ تنبيه الجودة", reportHtml, "normal");
      }
      return allPassed;
    }

    function injectRuntimeSniffer(htmlCode) {
      const snifferScript = `
        <script>
          window.onerror = function(msg, url, lineNo, colNo, error) {
            window.parent.postMessage({ type: 'RUNTIME_ERROR', message: msg, line: lineNo }, '*');
            return false;
          };
        <\/script>
      `;
      return htmlCode.replace("<head>", "<head>" + snifferScript);
    }

    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "RUNTIME_ERROR") {
        lastDetectedError = event.data.message;
        const fixBtn = `<button onclick="triggerAutoFix()" class="mt-2 bg-rose-600 hover:bg-rose-500 text-white font-bold py-1 px-3 rounded text-[11px] transition">🔧 إصلاح الخلل الذاتي فوراً</button>`;
        logMessage("🚨 خطأ تشغيلي في المعاينة", `حدث استثناء أثناء التشغيل:<br><code class="text-rose-300 font-mono">${event.data.message} (السطر: ${event.data.line})</code>${fixBtn}`, "error");
      }
    });

    async function triggerAutoFix() {
      if (!lastDetectedError || !currentHtmlCode) return;
      setLoader(true, "جارٍ الإصلاح الذاتي للشفرة...");
      const apiKey = getApiKey();

      try {
        const res = await fetch("/api/fix", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            ...(apiKey ? { "X-Custom-API-Key": apiKey } : {})
          },
          body: JSON.stringify({ code: currentHtmlCode, error: lastDetectedError })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "فشل الإصلاح الذاتي");

        currentHtmlCode = data.code;
        document.getElementById("codeView").value = currentHtmlCode;
        document.getElementById("liveFrame").srcdoc = injectRuntimeSniffer(currentHtmlCode);
        runQualityGate(currentHtmlCode);

        logMessage("✨ تم الإصلاح الذاتي بنجاح", "تمت معالجة الخلل وتحديث نافذة المعاينة الحية فوراً.", "success");
        lastDetectedError = null;
      } catch (err) {
        alert("خطأ الإصلاح الذاتي: " + err.message);
      } finally {
        setLoader(false);
      }
    }

    // --- Vision Triage & Consultation ---
    async function consultAndAnalyze() {
      const apiKey = getApiKey();
      const prompt = document.getElementById("promptInput").value.trim();

      if (!prompt && uploadedImages.length === 0) {
        alert("يرجى إدخال وصف للمشروع أو رفع صور المراجع والأصول.");
        return;
      }

      setLoader(true, "جارٍ الفرز البصري والاستشارة المعمارية...");
      document.getElementById("analysisStatus").innerText = "جارٍ التحليل الاستشاري...";

      try {
        const res = await fetch("/api/consult", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            ...(apiKey ? { "X-Custom-API-Key": apiKey } : {})
          },
          body: JSON.stringify({ 
            prompt: prompt || "قم بفرز المراجع والأصول المرفقة وتقديم استشارة معمارية لصياغة المخطط الهيكلي.",
            images: uploadedImages.map(i => i.base64),
            history: conversationHistory
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "فشل تحليل المستشار المعماري");

        currentBlueprint = data.blueprint;
        document.getElementById("blueprintView").value = JSON.stringify(currentBlueprint, null, 2);
        document.getElementById("btnBuild").disabled = false;

        // Archetype Badge
        const badge = document.getElementById("archetypeBadge");
        badge.innerText = `${data.project_domain || data.archetype}`;
        badge.classList.remove("hidden");

        // Format Triage Results
        let triageHtml = "";
        if (data.vision_triage && data.vision_triage.length > 0) {
          triageHtml = `<div class="bg-slate-950 p-2.5 rounded border border-slate-800 my-1 space-y-1">` +
            data.vision_triage.map((t, idx) => `
              <div class="flex items-center justify-between text-[11px]">
                <span class="text-slate-300">الصورة #${idx + 1}: ${t.description}</span>
                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${t.role === 'reference_layout' ? 'bg-sky-950 text-sky-400 border border-sky-800' : 'bg-emerald-950 text-emerald-400 border border-emerald-800'}">
                  ${t.role === 'reference_layout' ? 'هيكل مرجعي' : 'أصل للحقن'}
                </span>
              </div>
            `).join('') + `</div>`;
        }

        let adviceHtml = `<div class="space-y-1.5">
          ${triageHtml}
          <div class="text-slate-200 mt-1">${data.advice || ''}</div>
          ${data.clarification_question ? `<div class="p-2 bg-amber-500/10 border border-amber-500/20 rounded text-amber-300 font-medium text-[11px] mt-2">💡 سؤال استشاري: ${data.clarification_question}</div>` : ''}
        </div>`;

        logMessage("🏛️ تقرير المستشار المعماري والفرز", adviceHtml);
        document.getElementById("analysisStatus").innerText = "المخطط جاهز للتشييد";
        updateLiveTokenEstimate();

      } catch (err) {
        alert("خطأ: " + err.message);
        document.getElementById("analysisStatus").innerText = "حدث خطأ";
      } finally {
        setLoader(false);
      }
    }

    // --- Build Dynamic Project ---
    async function buildProject() {
      const blueprintText = document.getElementById("blueprintView").value.trim();
      const prompt = document.getElementById("promptInput").value.trim();
      const apiKey = getApiKey();

      if (!blueprintText) {
        alert("يرجى إعداد المخطط الهيكلي أولاً عبر الاستشارة المعمارية.");
        return;
      }

      setLoader(true, "جارٍ التشييد والبرمجة الخفيفة عند الحافة...");
      document.getElementById("analysisStatus").innerText = "جارٍ تشييد الواجهة...";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            ...(apiKey ? { "X-Custom-API-Key": apiKey } : {})
          },
          body: JSON.stringify({
            prompt: prompt || "شيد الواجهة كاملة بدقة هندسية بناءً على المخطط والأصول المحقونة.",
            blueprint: JSON.parse(blueprintText),
            embeddedAssets: uploadedImages.map(i => i.base64)
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "فشل تشييد الواجهة");

        currentHtmlCode = data.code || "";
        document.getElementById("codeView").value = currentHtmlCode;
        
        const frame = document.getElementById("liveFrame");
        frame.srcdoc = injectRuntimeSniffer(currentHtmlCode);
        switchTab('preview');

        runQualityGate(currentHtmlCode);
        document.getElementById("analysisStatus").innerText = "تم النشر في المعاينة الحية";
      } catch (err) {
        alert("خطأ التشييد: " + err.message);
        document.getElementById("analysisStatus").innerText = "فشل التشييد";
      } finally {
        setLoader(false);
      }
    }

    function downloadCode() {
      if (!currentHtmlCode) {
        alert("لا يوجد كود منشأ حالياً لتحميله.");
        return;
      }
      const blob = new Blob([currentHtmlCode], { type: "text/html;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "index.html";
      a.click();
    }
  </script>
</body>
</html>
