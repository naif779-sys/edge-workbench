<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-[100dvh] bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Edge Workbench - Universal UI Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    code, pre { font-family: 'JetBrains Mono', monospace; }
    
    .prose-content h1, .prose-content h2, .prose-content h3 { font-weight: 700; color: #f8fafc; margin-top: 0.75rem; margin-bottom: 0.5rem; }
    .prose-content h1 { font-size: 1.15rem; border-bottom: 1px solid #334155; padding-bottom: 0.25rem; }
    .prose-content h2 { font-size: 1.05rem; }
    .prose-content h3 { font-size: 0.95rem; }
    .prose-content p { margin-bottom: 0.5rem; line-height: 1.6; }
    .prose-content ul { list-style-type: disc; padding-right: 1.25rem; margin-bottom: 0.5rem; }
    .prose-content ol { list-style-type: decimal; padding-right: 1.25rem; margin-bottom: 0.5rem; }
    .prose-content li { margin-bottom: 0.25rem; }
    .prose-content table { width: 100%; border-collapse: collapse; margin: 0.75rem 0; font-size: 0.8rem; }
    .prose-content th, .prose-content td { border: 1px solid #334155; padding: 0.4rem 0.6rem; text-align: right; }
    .prose-content th { background-color: #1e293b; color: #38bdf8; font-weight: 600; }
    .prose-content tr:nth-child(even) { background-color: #0f172a; }
    .prose-content hr { border: 0; border-top: 1px solid #334155; margin: 0.75rem 0; }
    .prose-content blockquote { border-right: 3px solid #6366f1; padding-right: 0.75rem; color: #94a3b8; margin: 0.5rem 0; }
    .prose-content code { background-color: #020617; padding: 0.15rem 0.3rem; border-radius: 0.25rem; color: #38bdf8; font-size: 0.75rem; }
  </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden select-none bg-slate-950">

  <!-- الترويسة العلوية -->
  <header class="h-12 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-3 shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-3 h-3 rounded-full bg-indigo-500 ring-4 ring-indigo-500/20"></div>
      <h1 class="font-bold text-sm tracking-wide text-white">Edge Workbench <span class="text-[10px] text-indigo-400 border border-indigo-500/30 px-2 py-0.5 rounded-full mr-1">v2.8 Resilient</span></h1>
    </div>
    
    <div class="flex items-center gap-2">
      <button id="btn-export" onclick="exportStandaloneHTML()" disabled class="hidden bg-slate-800 text-slate-500 cursor-not-allowed px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 min-h-[36px]">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        <span>تصدير HTML</span>
      </button>
      <button onclick="startNewSession()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition min-h-[36px]">
        جلسة جديدة
      </button>
    </div>
  </header>

  <!-- مساحة العمل الرئيسية -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-2 p-2 min-h-0 overflow-hidden">

    <!-- العمود الأيمن: المستشار والمخطط -->
    <section class="flex flex-col bg-slate-900 border border-slate-800 rounded-xl overflow-hidden min-h-0">
      
      <div class="h-12 bg-slate-900/95 border-b border-slate-800 flex items-center justify-between px-3 shrink-0 gap-2">
        <div class="flex items-center gap-1">
          <div class="flex bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
            <button id="tab-chat" onclick="switchLeftTab('chat')" class="px-3 py-1 rounded-md bg-indigo-600 text-white font-medium min-h-[32px]">النقاش والتحليل</button>
            <button id="tab-blueprint" onclick="switchLeftTab('blueprint')" class="px-3 py-1 rounded-md text-slate-400 hover:text-white min-h-[32px]">المخطط (JSON)</button>
          </div>
        </div>

        <button id="btn-approve" onclick="approveAndImplement()" disabled class="bg-slate-800 text-slate-500 cursor-not-allowed px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 min-h-[36px]">
          <span>اعتماد المخطط وتشييده</span>
          <span>←</span>
        </button>
      </div>

      <!-- واجهة النقاش -->
      <div id="view-chat" class="flex-1 flex flex-col min-h-0 overflow-hidden">
        <div id="chat-messages" class="flex-1 p-3 overflow-y-auto space-y-3 text-xs sm:text-sm">
          <div id="welcome-msg" class="bg-slate-800/80 p-3 rounded-xl border border-slate-700/60 leading-relaxed text-slate-300">
            أهلاً بك. ناقش متطلبات أي مشروع تريده، ارفع صوراً للمحاكاة، ثم اضغط <strong>توليد المخطط</strong>.
          </div>
        </div>

        <div id="images-preview-bar" class="hidden px-3 py-2 bg-slate-950 border-t border-slate-800 flex items-center gap-2 overflow-x-auto shrink-0"></div>

        <div class="p-2.5 bg-slate-950 border-t border-slate-800 shrink-0 flex flex-col gap-2">
          <textarea id="prompt-input" rows="2" placeholder="اكتب وصف المشروع أو المتطلبات هنا..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs sm:text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition resize-none leading-relaxed" oninput="saveDraftText()"></textarea>
          
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <input type="file" id="image-input" accept="image/*" multiple class="hidden" onchange="handleFilesSelect(event)">
              <button onclick="document.getElementById('image-input').click()" class="h-10 px-3 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg border border-slate-800 flex items-center gap-1.5 text-xs transition font-medium">
                <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span>إرفاق صور</span>
                <span id="img-count-badge" class="hidden bg-indigo-600 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold">0</span>
              </button>
            </div>

            <div class="flex items-center gap-2">
              <button onclick="sendConsultationMessage()" class="h-10 bg-indigo-600 hover:bg-indigo-500 text-white px-4 rounded-lg text-xs font-semibold transition flex items-center gap-1 shadow-md shadow-indigo-900/30">
                <span>إرسال</span>
              </button>
              <button onclick="generateStructuredBlueprint()" class="h-10 bg-emerald-600 hover:bg-emerald-500 text-white px-4 rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-md shadow-emerald-900/30">
                <span>توليد المخطط</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- واجهة المخطط المعماري الهيكلي -->
      <div id="view-blueprint" class="flex-1 hidden flex-col min-h-0 overflow-hidden bg-slate-950">
        <pre id="blueprint-code" class="flex-1 min-h-0 p-3 overflow-y-auto text-xs text-emerald-400 selection:bg-emerald-900 leading-relaxed">// سيظهر كائن الـ JSON المعماري هنا...</pre>
      </div>
    </section>

    <!-- العمود الأيسر: المعاينة الحية والكود البرمجي -->
    <section id="preview-section" class="flex flex-col bg-slate-900 border border-slate-800 rounded-xl overflow-hidden min-h-0 relative transition-all">
      
      <div class="h-12 bg-slate-900/95 border-b border-slate-800 flex items-center justify-between px-3 shrink-0 gap-2">
        <div class="flex items-center gap-1.5">
          <div class="flex bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
            <button id="tab-preview" onclick="switchRightTab('preview')" class="px-3 py-1 rounded-md bg-indigo-600 text-white font-medium min-h-[32px]">المعاينة</button>
            <button id="tab-code" onclick="switchRightTab('code')" class="px-3 py-1 rounded-md text-slate-400 hover:text-white min-h-[32px]">الكود</button>
          </div>

          <div id="viewport-controls" class="hidden sm:flex items-center bg-slate-950 p-0.5 rounded-lg border border-slate-800 text-[11px]">
            <button onclick="setViewport('100%')" title="كامل الشاشة" class="px-2 py-1 rounded text-slate-300 hover:text-white hover:bg-slate-800">100%</button>
            <button onclick="setViewport('768px')" title="تابلت" class="px-2 py-1 rounded text-slate-400 hover:text-white hover:bg-slate-800">تابلت</button>
            <button onclick="setViewport('375px')" title="جوال" class="px-2 py-1 rounded text-slate-400 hover:text-white hover:bg-slate-800">جوال</button>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <button onclick="openInNewTab()" title="فتح الموقع في تبويب مستقل" class="h-8 px-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-md border border-slate-700 text-xs flex items-center gap-1 transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
            <span>تبويب مستقل</span>
          </button>
          <button id="btn-fullscreen" onclick="toggleFullScreenPreview()" title="ملء الشاشة" class="h-8 px-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-md border border-slate-700 text-xs flex items-center justify-center transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
          </button>
        </div>
      </div>

      <!-- حاوية المعاينة الداكنة -->
      <div id="view-preview" class="flex-1 bg-slate-950 flex flex-col min-h-0 overflow-hidden relative items-center justify-center">
        
        <!-- شريط التنبيهات المباشرة -->
        <div id="notification-banner" class="hidden absolute top-2 inset-x-2 z-20 p-2.5 rounded-lg text-xs font-semibold shadow-lg text-center transition-all"></div>

        <div id="sandbox-status" class="absolute inset-0 flex flex-col items-center justify-center p-4 text-center text-xs text-slate-400 bg-slate-950 z-10">
          <div id="status-spinner" class="hidden w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin mb-2"></div>
          <p id="status-text">الحالة: بانتظار اعتماد وتشييد المخطط</p>
        </div>
        
        <div id="frame-wrapper" class="w-full h-full transition-all duration-200 flex justify-center bg-slate-950">
          <iframe id="sandbox-frame" class="w-full h-full border-0 bg-slate-950 transition-all duration-200" sandbox="allow-scripts allow-modals"></iframe>
        </div>

        <!-- شريط التعديل التكراري المباشر -->
        <div id="refine-bar" class="w-full p-2 bg-slate-900 border-t border-slate-800 shrink-0">
          <div class="flex items-center gap-1.5">
            <input type="text" id="refine-input" placeholder="اطلب تعديلاً مباشراً على هذا التصميم (مثال: أضف عداد تنازلي)..." class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
            <button id="btn-apply-refine" onclick="applyRefinement()" class="h-9 px-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold whitespace-nowrap transition flex items-center gap-1">
              <span>تطبيق التعديل</span>
            </button>
          </div>
        </div>
      </div>

      <div id="view-source" class="flex-1 hidden bg-slate-950 p-3 overflow-auto min-h-0">
        <pre id="source-code" class="text-xs text-indigo-300 leading-relaxed">// الكود المصدري المستقل سيظهر هنا...</pre>
      </div>
    </section>

  </main>

  <script>
    let currentBlueprint = null;
    let currentGeneratedCode = null;
    let attachedImages = [];
    let conversationHistory = [];
    let isFullScreen = false;

    window.addEventListener('DOMContentLoaded', () => {
      loadCurrentSession();
    });

    function showNotice(text, type = 'info') {
      const banner = document.getElementById('notification-banner');
      banner.className = `absolute top-2 inset-x-2 z-20 p-2.5 rounded-lg text-xs font-semibold shadow-lg text-center transition-all ${
        type === 'error' ? 'bg-rose-900/90 text-rose-200 border border-rose-700' : 'bg-indigo-900/90 text-indigo-200 border border-indigo-700'
      }`;
      banner.textContent = text;
      banner.classList.remove('hidden');
      setTimeout(() => { banner.classList.add('hidden'); }, 4000);
    }

    function saveCurrentSession() {
      const state = {
        history: conversationHistory,
        blueprint: currentBlueprint,
        code: currentGeneratedCode,
        draft: document.getElementById('prompt-input').value
      };
      localStorage.setItem('workbench_active_session', JSON.stringify(state));
    }

    function loadCurrentSession() {
      try {
        const raw = localStorage.getItem('workbench_active_session');
        if (!raw) return;
        const state = JSON.parse(raw);

        if (state.draft) document.getElementById('prompt-input').value = state.draft;

        if (state.history && state.history.length > 0) {
          conversationHistory = state.history;
          const welcome = document.getElementById('welcome-msg');
          if (welcome) welcome.remove();

          conversationHistory.forEach(item => {
            appendMessage(item.role, item.content, item.images, false);
          });
        }

        if (state.blueprint) {
          currentBlueprint = state.blueprint;
          document.getElementById('blueprint-code').textContent = typeof state.blueprint === 'string' ? state.blueprint : JSON.stringify(state.blueprint, null, 2);
          const btn = document.getElementById('btn-approve');
          btn.disabled = false;
          btn.className = 'bg-emerald-600 hover:bg-emerald-500 text-white cursor-pointer px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-md shadow-emerald-900/30';
        }

        if (state.code) {
          currentGeneratedCode = state.code;
          document.getElementById('source-code').textContent = state.code;
          document.getElementById('sandbox-frame').srcdoc = state.code;
          document.getElementById('sandbox-status').classList.add('hidden');

          const exportBtn = document.getElementById('btn-export');
          exportBtn.classList.remove('hidden');
          exportBtn.disabled = false;
          exportBtn.className = 'bg-indigo-600 hover:bg-indigo-500 text-white cursor-pointer px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-md shadow-indigo-900/30 min-h-[36px]';
        }
      } catch (e) {
        console.error('فشل استرجاع الجلسة:', e);
      }
    }

    function saveDraftText() {
      saveCurrentSession();
    }

    function switchLeftTab(tab) {
      const isChat = tab === 'chat';
      document.getElementById('view-chat').classList.toggle('hidden', !isChat);
      document.getElementById('view-blueprint').classList.toggle('hidden', isChat);
      document.getElementById('tab-chat').className = isChat ? 'px-3 py-1 rounded-md bg-indigo-600 text-white font-medium min-h-[32px]' : 'px-3 py-1 rounded-md text-slate-400 hover:text-white min-h-[32px]';
      document.getElementById('tab-blueprint').className = !isChat ? 'px-3 py-1 rounded-md bg-indigo-600 text-white font-medium min-h-[32px]' : 'px-3 py-1 rounded-md text-slate-400 hover:text-white min-h-[32px]';
    }

    function switchRightTab(tab) {
      const isPreview = tab === 'preview';
      document.getElementById('view-preview').classList.toggle('hidden', !isPreview);
      document.getElementById('view-source').classList.toggle('hidden', isPreview);
      document.getElementById('tab-preview').className = isPreview ? 'px-3 py-1 rounded-md bg-indigo-600 text-white font-medium min-h-[32px]' : 'px-3 py-1 rounded-md text-slate-400 hover:text-white min-h-[32px]';
      document.getElementById('tab-code').className = !isPreview ? 'px-3 py-1 rounded-md bg-indigo-600 text-white font-medium min-h-[32px]' : 'px-3 py-1 rounded-md text-slate-400 hover:text-white min-h-[32px]';
    }

    function setViewport(width) {
      const wrapper = document.getElementById('frame-wrapper');
      wrapper.style.maxWidth = width;
      wrapper.className = width !== '100%' 
        ? 'w-full h-full transition-all duration-200 flex justify-center border-x border-slate-800 shadow-2xl bg-slate-950' 
        : 'w-full h-full transition-all duration-200 flex justify-center bg-slate-950';
    }

    function toggleFullScreenPreview() {
      const sec = document.getElementById('preview-section');
      isFullScreen = !isFullScreen;
      sec.className = isFullScreen 
        ? 'fixed inset-0 z-50 flex flex-col bg-slate-900 overflow-hidden' 
        : 'flex flex-col bg-slate-900 border border-slate-800 rounded-xl overflow-hidden min-h-0 relative transition-all';
    }

    function openInNewTab() {
      if (!currentGeneratedCode) {
        showNotice('يرجى تشييد الواجهة أولاً لفتحها في تبويب مستقل.', 'error');
        return;
      }
      const blob = new Blob([currentGeneratedCode], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
    }

    function handleFilesSelect(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(evt) {
          attachedImages.push({ name: file.name, base64: evt.target.result });
          renderImagesPreview();
        };
        reader.readAsDataURL(file);
      });
      e.target.value = '';
    }

    function removeImage(index) {
      attachedImages.splice(index, 1);
      renderImagesPreview();
    }

    function renderImagesPreview() {
      const bar = document.getElementById('images-preview-bar');
      const badge = document.getElementById('img-count-badge');
      bar.innerHTML = '';

      if (attachedImages.length === 0) {
        bar.classList.add('hidden');
        badge.classList.add('hidden');
        return;
      }

      badge.textContent = attachedImages.length;
      badge.classList.remove('hidden');
      bar.classList.remove('hidden');

      attachedImages.forEach((img, idx) => {
        const thumb = document.createElement('div');
        thumb.className = 'relative shrink-0 w-12 h-12 rounded-lg border border-indigo-500/50 overflow-hidden group';
        thumb.innerHTML = `
          <img src="${img.base64}" class="w-full h-full object-cover">
          <button onclick="removeImage(${idx})" class="absolute inset-0 bg-slate-950/70 text-rose-400 opacity-0 group-hover:opacity-100 group-focus:opacity-100 flex items-center justify-center font-bold text-xs transition">✕</button>
        `;
        bar.appendChild(thumb);
      });
    }

    function appendMessage(role, text, images = [], shouldSave = true) {
      const chat = document.getElementById('chat-messages');
      const msgDiv = document.createElement('div');
      
      if (role === 'user') {
        msgDiv.className = 'bg-indigo-950/70 p-3 rounded-xl border border-indigo-800/50 leading-relaxed text-indigo-100 mr-4';
        let html = `<p class="whitespace-pre-wrap">${text}</p>`;
        if (images && images.length > 0) {
          html += `<div class="mt-2.5 flex flex-wrap gap-2">`;
          images.forEach(img => {
            html += `<img src="${img.base64 || img}" class="w-16 h-16 object-cover rounded-lg border border-indigo-700">`;
          });
          html += `</div>`;
        }
        msgDiv.innerHTML = html;
      } else {
        msgDiv.className = 'bg-slate-900 p-3.5 rounded-xl border border-slate-800 leading-relaxed text-slate-200 ml-4 prose-content shadow-sm';
        msgDiv.innerHTML = marked.parse(text);
      }

      chat.appendChild(msgDiv);
      chat.scrollTop = chat.scrollHeight;

      if (shouldSave) saveCurrentSession();
    }

    async function sendConsultationMessage() {
      const input = document.getElementById('prompt-input');
      const text = input.value.trim();
      if (!text && attachedImages.length === 0) return;

      const currentImages = [...attachedImages];
      appendMessage('user', text || 'مرفق صور مرجعية للمعاينة', currentImages);
      conversationHistory.push({ role: 'user', content: text, images: currentImages });

      input.value = '';
      attachedImages = [];
      renderImagesPreview();
      saveCurrentSession();

      const loadingMsg = document.createElement('div');
      loadingMsg.className = 'text-xs text-indigo-400 italic p-2';
      loadingMsg.textContent = 'جاري التحليل المعماري وصياغة الرأي عبر Gemini Flash...';
      document.getElementById('chat-messages').appendChild(loadingMsg);
      document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;

      try {
        const res = await fetch('/api/consult', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, images: currentImages, history: conversationHistory })
        });
        const data = await res.json();
        loadingMsg.remove();
        if (data.reply) {
          appendMessage('assistant', data.reply);
          conversationHistory.push({ role: 'assistant', content: data.reply });
          saveCurrentSession();
        } else {
          appendMessage('assistant', data.error || 'تعذر استلام الرد.');
        }
      } catch (e) {
        loadingMsg.remove();
        appendMessage('assistant', 'خطأ في الاتصال بالخدمة: ' + e.message);
      }
    }

    async function generateStructuredBlueprint() {
      const input = document.getElementById('prompt-input');
      const text = input.value.trim();
      const currentImages = [...attachedImages];

      if (text || currentImages.length > 0) {
        conversationHistory.push({ role: 'user', content: text, images: currentImages });
        input.value = '';
        attachedImages = [];
        renderImagesPreview();
      }

      switchLeftTab('blueprint');
      const codeEl = document.getElementById('blueprint-code');
      codeEl.textContent = '// جاري صياغة المخطط المعماري التجريدي عبر DeepSeek...';

      try {
        const res = await fetch('/api/plan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ history: conversationHistory, images: currentImages })
        });
        const data = await res.json();
        const content = data.choices ? data.choices[0].message.content : (data.error || JSON.stringify(data, null, 2));
        codeEl.textContent = content;
        currentBlueprint = content;

        const btn = document.getElementById('btn-approve');
        btn.disabled = false;
        btn.className = 'bg-emerald-600 hover:bg-emerald-500 text-white cursor-pointer px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-md shadow-emerald-900/30';
        saveCurrentSession();
      } catch (e) {
        codeEl.textContent = '// خطأ في توليد المخطط: ' + e.message;
      }
    }

    async function approveAndImplement() {
      if (!currentBlueprint) return;
      const status = document.getElementById('sandbox-status');
      const spinner = document.getElementById('status-spinner');
      const statusText = document.getElementById('status-text');

      status.classList.remove('hidden');
      spinner.classList.remove('hidden');
      statusText.textContent = 'جاري تشييد الواجهة وبناء كود الويب المستقل...';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ blueprint: currentBlueprint })
        });
        
        const data = await res.json();

        if (!res.ok || data.error || !data.code) {
          throw new Error(data.error || 'لم يتم استلام كود صالح من الخادم.');
        }

        const code = data.code;
        currentGeneratedCode = code;
        document.getElementById('source-code').textContent = code;
        
        const frame = document.getElementById('sandbox-frame');
        frame.srcdoc = code;
        
        status.classList.add('hidden');
        spinner.classList.add('hidden');

        const exportBtn = document.getElementById('btn-export');
        exportBtn.classList.remove('hidden');
        exportBtn.disabled = false;
        exportBtn.className = 'bg-indigo-600 hover:bg-indigo-500 text-white cursor-pointer px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-md shadow-indigo-900/30 min-h-[36px]';
        saveCurrentSession();
      } catch (e) {
        spinner.classList.add('hidden');
        statusText.innerHTML = `<span class="text-rose-400 font-bold">خطأ في التشييد:</span><br>${e.message}`;
      }
    }

    async function applyRefinement() {
      const input = document.getElementById('refine-input');
      const instruction = input.value.trim();

      if (!instruction) {
        showNotice('يرجى كتابة التعديل المطلوب أولاً.', 'error');
        return;
      }

      if (!currentGeneratedCode) {
        showNotice('يجب الضغط على [اعتماد المخطط وتشييده] أولاً لتوليد الصفحة الأساسية قبل التعديل.', 'error');
        return;
      }

      const status = document.getElementById('sandbox-status');
      const spinner = document.getElementById('status-spinner');
      const statusText = document.getElementById('status-text');

      status.classList.remove('hidden');
      spinner.classList.remove('hidden');
      statusText.textContent = 'جاري تطبيق التعديل التكراري عبر DeepSeek...';

      try {
        const res = await fetch('/api/refine', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            current_code: currentGeneratedCode,
            refinement_instruction: instruction
          })
        });
        
        const data = await res.json();

        if (!res.ok || data.error || !data.code) {
          throw new Error(data.error || 'فشل تطبيق التعديل.');
        }

        const code = data.code;
        currentGeneratedCode = code;
        document.getElementById('source-code').textContent = code;
        document.getElementById('sandbox-frame').srcdoc = code;
        input.value = '';
        
        status.classList.add('hidden');
        spinner.classList.add('hidden');
        showNotice('تم تطبيق التعديل بنجاح.');
        saveCurrentSession();
      } catch (e) {
        spinner.classList.add('hidden');
        statusText.innerHTML = `<span class="text-rose-400 font-bold">خطأ أثناء التعديل:</span><br>${e.message}`;
      }
    }

    function exportStandaloneHTML() {
      if (!currentGeneratedCode) return;
      const blob = new Blob([currentGeneratedCode], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function startNewSession() {
      if (confirm('هل تريد بدء جلسة جديدة وأرشفة الجلسة الحالية؟')) {
        const raw = localStorage.getItem('workbench_active_session');
        if (raw) {
          let sessions = JSON.parse(localStorage.getItem('workbench_saved_sessions') || '[]');
          sessions.unshift(JSON.parse(raw));
          if (sessions.length > 3) sessions = sessions.slice(0, 3);
          localStorage.setItem('workbench_saved_sessions', JSON.stringify(sessions));
        }
        localStorage.removeItem('workbench_active_session');
        location.reload();
      }
    }
  </script>
</body>
