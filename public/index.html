<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agentic Web Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-[100dvh] overflow-hidden font-sans select-none">

  <!-- Header -->
  <header class="h-14 border-b border-slate-800 flex items-center justify-between px-4 sm:px-6 bg-slate-900/90 backdrop-blur flex-shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-indigo-500 animate-pulse"></div>
      <h1 class="text-sm sm:text-base font-bold tracking-wide text-slate-100">منصة بناء المواقع الذكية (Agentic Web Builder)</h1>
    </div>
    <div class="flex items-center gap-2">
      <button id="resetSessionBtn" onclick="location.reload()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs px-3 py-1.5 rounded-lg text-slate-300 transition">مشروع جديد</button>
    </div>
  </header>

  <!-- Dual Workspace Layout -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-3 p-3 min-h-0 overflow-hidden">
    
    <!-- Planner Panel (MiniMax) -->
    <section class="flex flex-col bg-slate-900/50 border border-slate-800 rounded-2xl min-h-0 overflow-hidden p-3 gap-3">
      <div class="flex items-center justify-between pb-2 border-b border-slate-800 flex-shrink-0">
        <span class="text-xs font-semibold text-indigo-400 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
          المخطط المعماري (MiniMax Planner)
        </span>
        <span class="text-[11px] text-slate-500 font-mono">JSON Blueprint</span>
      </div>

      <!-- Blueprint / Plan Preview Area -->
      <div id="planContainer" class="flex-1 min-h-0 overflow-y-auto bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 font-mono text-xs text-slate-300">
        <div class="text-slate-500 text-center mt-10">بانتظار إدخال متطلبات المشروع لتوليد المخطط الهيكلي...</div>
      </div>

      <!-- Action: Approve Blueprint -->
      <div class="flex justify-between items-center pt-2 flex-shrink-0">
        <button id="approveBtn" disabled class="bg-emerald-600 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2 rounded-xl transition flex items-center gap-1.5">
          <span>اعتماد المخطط ونقله للتنفيذ</span>
          <span>←</span>
        </button>
      </div>

      <!-- Planner Input Bar -->
      <div class="flex-shrink-0 bg-slate-900 border border-slate-800 rounded-xl p-2 flex flex-col gap-2">
        <textarea id="plannerInput" rows="2" placeholder="صف فكرة الموقع، الأقسام، والألوان المطلوبة..." class="w-full bg-transparent border-0 text-xs text-slate-100 placeholder-slate-500 focus:outline-none resize-none"></textarea>
        <div class="flex justify-end">
          <button id="generatePlanBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-1.5 rounded-lg transition">
            توليد المخطط الهيكلي
          </button>
        </div>
      </div>
    </section>

    <!-- Implementer Panel (Claude Sonnet & Sandbox) -->
    <section class="flex flex-col bg-slate-900/50 border border-slate-800 rounded-2xl min-h-0 overflow-hidden p-3 gap-3">
      <div class="flex items-center justify-between pb-2 border-b border-slate-800 flex-shrink-0">
        <span class="text-xs font-semibold text-emerald-400 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          المنفذ والمعاينة (Claude Sonnet + Sandbox)
        </span>
        <div class="flex gap-1.5">
          <button id="tabPreview" class="text-xs px-2.5 py-1 bg-slate-800 text-slate-200 rounded-lg font-medium">المعاينة الحية</button>
          <button id="tabCode" class="text-xs px-2.5 py-1 bg-transparent text-slate-400 hover:text-slate-200 rounded-lg font-medium">الكود المصدري</button>
        </div>
      </div>

      <!-- Implementer Workspace -->
      <div class="flex-1 min-h-0 bg-slate-950 border border-slate-800/80 rounded-xl overflow-hidden relative">
        <!-- Live Sandbox iFrame -->
        <iframe id="sandboxFrame" class="w-full h-full border-0 bg-white" sandbox="allow-scripts allow-modals"></iframe>
        
        <!-- Raw Code Viewer (Hidden by default) -->
        <pre id="rawCodeViewer" class="hidden w-full h-full p-3 font-mono text-xs text-slate-300 overflow-auto bg-slate-950"></pre>
      </div>

      <!-- Execution Status Bar -->
      <div id="executionStatus" class="flex-shrink-0 text-xs text-slate-400 flex items-center justify-between px-1">
        <span>الحالة: بانتظار المخطط المعتمد</span>
        <span id="tokenStats" class="font-mono text-[11px] text-slate-500"></span>
      </div>
    </section>

  </main>

  <script src="/app.js" defer></script>
</body>
</html>
