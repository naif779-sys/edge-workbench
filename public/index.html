<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة Edge Workbench | تشييد المتاجر عند الحافة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 font-bold text-lg">
        ⚡
      </div>
      <div>
        <h1 class="text-base font-bold text-white leading-none">Edge Workbench</h1>
        <p class="text-xs text-slate-400 mt-0.5">محرك بناء المتاجر الفوري عند الحافة</p>
      </div>
    </div>

    <!-- API Key Input -->
    <div class="flex items-center gap-2">
      <input type="password" id="customApiKey" placeholder="مفتاح OpenRouter (يُحفظ تلقائياً)" 
             onchange="saveApiKey(this.value)"
             class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500/50 w-48 md:w-64 transition">
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> جاهز
      </span>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 p-4 max-w-[1800px] w-full mx-auto">
    
    <!-- Control & Discussion Panel (Right) -->
    <section class="lg:col-span-5 flex flex-col gap-4">
      
      <!-- 1. Upper Box: Prompt & Iterative Conversation -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col gap-3 shadow-sm">
        <div class="flex items-center justify-between">
          <label class="text-sm font-bold text-slate-200 flex items-center gap-2">
            <span>💬</span> متطلبات المتجر والمحادثة التكرارية
          </label>
          <span class="text-[11px] text-slate-400">كتابة الوصف أو طلب التعديل</span>
        </div>

        <textarea id="promptInput" rows="3" 
                  oninput="updateLiveTokenEstimate()"
                  placeholder="اكتب وصف المتجر، أو اطلب تعديلاً (مثال: اجعل الأزرار دائرية، غيّر الخط، أضف قسماً للتقييمات)..."
                  class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 custom-scroll resize-none"></textarea>
        
        <!-- Hidden File Input -->
        <input type="file" id="imageInput" multiple accept="image/*" class="hidden" onchange="handleImageSelection(event)">

        <!-- Three Horizontal Action Buttons -->
        <div class="grid grid-cols-3 gap-2 pt-1">
          <button id="btnReadImage" onclick="analyzeAndPlan()" 
                  class="bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white font-bold py-2 px-2 rounded-lg text-xs transition flex items-center justify-center gap-1">
            <span>👁️</span> قراءة وتحليل
          </button>

          <button onclick="document.getElementById('imageInput').click()" 
                  class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 font-bold py-2 px-2 rounded-lg text-xs border border-slate-700 transition flex items-center justify-center gap-1">
            <span>🖼️</span> رفع الصور مباشرة
          </button>
          
          <button id="btnPlan" onclick="generateBlueprint()" 
                  class="bg-amber-600 hover:bg-amber-500 active:bg-amber-700 text-slate-950 font-bold py-2 px-2 rounded-lg text-xs transition flex items-center justify-center gap-1">
            <span>⚙️</span> توليد المخطط
          </button>
        </div>

        <!-- Image Thumbnails Container -->
        <div id="imagePreviewContainer" class="flex gap-2 overflow-x-auto py-1 custom-scroll hidden border-t border-slate-800/80 pt-2"></div>
      </div>

      <!-- 2. Lower Box: Visual Comprehension & Discussion Log -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex-1 flex flex-col gap-3 min-h-[280px] shadow-sm">
        <div class="flex items-center justify-between">
          <label class="text-sm font-bold text-slate-200 flex items-center gap-2">
            <span>🧠</span> شاشة الاستيعاب والتحليل المعماري
          </label>
          <span id="analysisStatus" class="text-xs text-slate-400">بانتظار المدخلات...</span>
        </div>
        
        <div id="analysisLog" 
             class="w-full flex-1 bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-300 custom-scroll overflow-y-auto leading-relaxed space-y-2 font-sans">
          <p class="text-slate-500 italic">ستظهر هنا تفاصيل ما فهمه الذكاء الاصطناعي من الصور والنصوص (الألوان، توزيع الأقسام، الهوية البصرية، وملاحظات التطوير)...</p>
        </div>
        
        <!-- Bottom Action Bar (Estimate & Build) -->
        <div class="grid grid-cols-12 gap-2 pt-1">
          <button id="btnEstimate" onclick="estimateBuildTokens()" 
                  class="col-span-5 bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold py-2.5 px-2 rounded-lg text-xs border border-slate-700 transition flex items-center justify-center gap-1.5">
            <span>📊</span> <span id="estimateBtnLabel">تقدير التوكن</span>
          </button>

          <button id="btnBuild" onclick="buildStore()" disabled
                  class="col-span-7 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold py-2.5 px-3 rounded-lg text-xs transition flex items-center justify-center gap-1.5">
            <span>🚀</span> تشييد وبرمجة المتجر
          </button>
        </div>
      </div>
    </section>

    <!-- Preview & Outputs Panel (Left) -->
    <section class="lg:col-span-7 flex flex-col bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-sm">
      
      <!-- Toolbar with 3 Tabs -->
      <div class="bg-slate-900/90 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <button id="tabPreview" onclick="switchTab('preview')" class="px-3 py-1 rounded text-xs font-bold bg-slate-800 text-white">معاينة حية</button>
          <button id="tabCode" onclick="switchTab('code')" class="px-3 py-1 rounded text-xs font-medium text-slate-400 hover:text-white">الكود المصدري</button>
          <button id="tabBlueprint" onclick="switchTab('blueprint')" class="px-3 py-1 rounded text-xs font-medium text-slate-400 hover:text-white">📐 المخطط الهيكلي</button>
        </div>
        
        <div class="flex items-center gap-2">
          <button onclick="downloadCode()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1 rounded border border-slate-700 transition flex items-center gap-1">
            📥 تحميل HTML
          </button>
        </div>
      </div>

      <!-- Content Area -->
      <div class="flex-1 relative bg-slate-950 flex flex-col min-h-[480px]">
        <!-- 1. Live Frame -->
        <iframe id="liveFrame" class="w-full h-full flex-1 border-none bg-white"></iframe>
        
        <!-- 2. Source Code View -->
        <textarea id="codeView" readonly 
                  class="hidden w-full h-full flex-1 bg-slate-950 text-emerald-400 font-mono text-xs p-4 focus:outline-none custom-scroll resize-none"
                  placeholder="سيظهر الكود المصدري هنا فور اكتمال التشييد..."></textarea>

        <!-- 3. Blueprint JSON View -->
        <textarea id="blueprintView" 
                  oninput="updateLiveTokenEstimate()"
                  class="hidden w-full h-full flex-1 bg-slate-950 text-amber-400 font-mono text-xs p-4 focus:outline-none custom-scroll resize-none"
                  placeholder="سيظهر كائن JSON الخاص بالمخطط الهيكلي هنا ويمكنك تعديله..."></textarea>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center gap-3 z-20">
          <div class="w-8 h-8 border-3 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
          <p id="loadingText" class="text-sm font-medium text-slate-300">جارٍ المعالجة...</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    let currentHtmlCode = "";
    let currentBlueprint = null;
    let uploadedImages = [];
    let imageTokensCount = 0;

    document.addEventListener("DOMContentLoaded", () => {
      const savedKey = localStorage.getItem("EDGE_WORKBENCH_API_KEY");
      if (savedKey) document.getElementById("customApiKey").value = savedKey;
      updateLiveTokenEstimate();
    });

    function saveApiKey(key) {
      if (key) localStorage.setItem("EDGE_WORKBENCH_API_KEY", key.trim());
      else localStorage.removeItem("EDGE_WORKBENCH_API_KEY");
    }

    function getApiKey() {
      return document.getElementById("customApiKey").value.trim() || localStorage.getItem("EDGE_WORKBENCH_API_KEY") || "";
    }

    function setLoader(show, text = "") {
      const overlay = document.getElementById("loadingOverlay");
      const label = document.getElementById("loadingText");
      if (show) {
        label.innerText = text;
        overlay.classList.remove("hidden");
      } else {
        overlay.classList.add("hidden");
      }
    }

    function switchTab(tab) {
      const frame = document.getElementById("liveFrame");
      const code = document.getElementById("codeView");
      const bp = document.getElementById("blueprintView");
      const tabP = document.getElementById("tabPreview");
      const tabC = document.getElementById("tabCode");
      const tabB = document.getElementById("tabBlueprint");

      frame.classList.add("hidden");
      code.classList.add("hidden");
      bp.classList.add("hidden");
      tabP.className = "px-3 py-1 rounded text-xs font-medium text-slate-400 hover:text-white";
      tabC.className = "px-3 py-1 rounded text-xs font-medium text-slate-400 hover:text-white";
      tabB.className = "px-3 py-1 rounded text-xs font-medium text-slate-400 hover:text-white";

      if (tab === 'preview') {
        frame.classList.remove("hidden");
        tabP.className = "px-3 py-1 rounded text-xs font-bold bg-slate-800 text-white";
      } else if (tab === 'code') {
        code.classList.remove("hidden");
        tabC.className = "px-3 py-1 rounded text-xs font-bold bg-slate-800 text-white";
      } else if (tab === 'blueprint') {
        bp.classList.remove("hidden");
        tabB.className = "px-3 py-1 rounded text-xs font-bold bg-slate-800 text-white";
      }
    }

    function compressImage(file, maxWidth = 1024, quality = 0.7) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            const imgTokens = Math.ceil((width * height) / 750);
            resolve({ base64: canvas.toDataURL("image/jpeg", quality), tokens: imgTokens });
          };
        };
      });
    }

    async function handleImageSelection(event) {
      const files = event.target.files;
      if (!files.length) return;

      const container = document.getElementById("imagePreviewContainer");
      container.classList.remove("hidden");

      for (let file of Array.from(files)) {
        const result = await compressImage(file, 1024, 0.7);
        uploadedImages.push({ base64: result.base64, tokens: result.tokens });
        imageTokensCount += result.tokens;

        const thumb = document.createElement("div");
        thumb.className = "relative w-14 h-14 rounded-lg overflow-hidden border border-slate-700 shrink-0";
        thumb.innerHTML = `
          <img src="${result.base64}" class="w-full h-full object-cover">
          <button onclick="removeImage(this, '${result.base64}', ${result.tokens})" class="absolute top-0.5 right-0.5 bg-rose-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px] leading-none">×</button>
        `;
        container.appendChild(thumb);
      }
      updateLiveTokenEstimate();
    }

    function removeImage(btn, base64, tokens) {
      btn.parentElement.remove();
      uploadedImages = uploadedImages.filter(img => img.base64 !== base64);
      imageTokensCount = Math.max(0, imageTokensCount - tokens);
      if (uploadedImages.length === 0) {
        document.getElementById("imagePreviewContainer").classList.add("hidden");
      }
      updateLiveTokenEstimate();
    }

    function updateLiveTokenEstimate() {
      const prompt = document.getElementById("promptInput").value || "";
      const bp = document.getElementById("blueprintView").value || "";
      const textTokens = Math.ceil((prompt.length + bp.length) / 2.8);
      const total = textTokens + imageTokensCount;
      const cost = (total / 1000000) * 0.25;
      document.getElementById("estimateBtnLabel").innerText = `~${total} توكن ($${cost.toFixed(4)})`;
    }

    function estimateBuildTokens() {
      const prompt = document.getElementById("promptInput").value || "";
      const bp = document.getElementById("blueprintView").value || "";
      const inputTokens = Math.ceil((prompt.length + bp.length) / 2.8) + imageTokensCount;
      const expectedOutputTokens = 3500; // Average single-file store size
      const totalTokens = inputTokens + expectedOutputTokens;
      const cost = ((inputTokens * 0.25) + (expectedOutputTokens * 1.25)) / 1000000;

      alert(`📊 تقدير الاستهلاك والتكلفة المتوقعة لبناء المتجر:\n` +
            `• توكن المدخلات: ${inputTokens.toLocaleString()} توكن\n` +
            `• توكن الشفرة المتوقعة: ~${expectedOutputTokens.toLocaleString()} توكن\n` +
            `• إجمالي العملية: ~${totalTokens.toLocaleString()} توكن\n` +
            `• التكلفة التقديرية الإجمالية: ~$${cost.toFixed(5)} (أقل من هللة واحدة)`);
    }

    function logMessage(title, message, isAi = true) {
      const log = document.getElementById("analysisLog");
      const entry = document.createElement("div");
      entry.className = `p-2.5 rounded-lg border text-xs leading-relaxed ${isAi ? 'bg-slate-900 border-slate-800 text-slate-200' : 'bg-amber-950/30 border-amber-800/40 text-amber-200'}`;
      entry.innerHTML = `<div class="font-bold mb-1 text-[11px] text-amber-400">${title}</div><div>${message}</div>`;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    }

    // 1. Vision Analysis & Blueprint Generation
    async function analyzeAndPlan() {
      const apiKey = getApiKey();
      const prompt = document.getElementById("promptInput").value.trim();

      if (uploadedImages.length === 0) {
        alert("يرجى اختيار صورة النموذج أو التصميم أولاً لقراءتها.");
        return;
      }

      setLoader(true, "جارٍ فحص النموذج بصرياً واستخراج عناصر التصميم...");
      document.getElementById("analysisStatus").innerText = "جارٍ التحليل البصري...";

      try {
        const res = await fetch("/api/consult", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            ...(apiKey ? { "X-Custom-API-Key": apiKey } : {})
          },
          body: JSON.stringify({ 
            prompt: prompt || "حلل هذا التصميم بدقة واستخرج الهيكل والأقسام ونظام الألوان.",
            images: uploadedImages.map(i => i.base64)
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "فشل التحليل البصري");

        currentBlueprint = data.blueprint;
        document.getElementById("blueprintView").value = JSON.stringify(currentBlueprint, null, 2);
        document.getElementById("btnBuild").disabled = false;

        const summary = `تم استيعاب التصميم بنجاح:\n` +
                        `• النمط: ${currentBlueprint.theme?.mode === 'dark' ? 'داكن (Dark Mode)' : 'فاتح (Light Mode)'}\n` +
                        `• الأقسام المستخرجة: ${currentBlueprint.sections?.map(s => s.title || s.type).join('، ') || 'أقسام تجارية متكاملة'}\n` +
                        `• الهوية: تم ضبط اتجاه RTL وتناسق الألوان في المخطط الهيكلي.`;
        
        logMessage("👁️ نتيجة التحليل البصري للنموذج", summary.replace(/\n/g, '<br>'));
        document.getElementById("analysisStatus").innerText = "تم إعداد المخطط الهيكلي";
        updateLiveTokenEstimate();
      } catch (err) {
        alert("خطأ: " + err.message);
        document.getElementById("analysisStatus").innerText = "حدث خطأ";
      } finally {
        setLoader(false);
      }
    }

    // 2. Text-Based Blueprint Generation
    async function generateBlueprint() {
      const prompt = document.getElementById("promptInput").value.trim();
      const apiKey = getApiKey();

      if (!prompt && uploadedImages.length === 0) {
        alert("يرجى إدخال وصف المتجر أولاً.");
        return;
      }

      setLoader(true, "جارٍ صياغة المخطط الهيكلي وتنسيق الأقسام...");
      document.getElementById("analysisStatus").innerText = "جارٍ صياغة المخطط...";

      try {
        const res = await fetch("/api/plan", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            ...(apiKey ? { "X-Custom-API-Key": apiKey } : {})
          },
          body: JSON.stringify({ prompt: prompt || "متجر إلكتروني متكامل" })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "فشل توليد المخطط");

        currentBlueprint = data.blueprint;
        document.getElementById("blueprintView").value = JSON.stringify(currentBlueprint, null, 2);
        document.getElementById("btnBuild").disabled = false;

        const summary = `تم اعتماد متطلبات المتجر بنجاح:\n` +
                        `• النمط: ${currentBlueprint.theme?.mode || 'داكن'}\n` +
                        `• عدد الأقسام الأساسية: ${currentBlueprint.sections?.length || 0} أقسام.\n` +
                        `• يمكنك مراجعة الـ JSON من تبويب [المخطط الهيكلي] أو البدء بالتشييد الفوري.`;

        logMessage("⚙️ اعتماد المخطط الهيكلي", summary.replace(/\n/g, '<br>'));
        document.getElementById("analysisStatus").innerText = "المخطط جاهز للتشييد";
        updateLiveTokenEstimate();
      } catch (err) {
        alert("خطأ: " + err.message);
        document.getElementById("analysisStatus").innerText = "حدث خطأ";
      } finally {
        setLoader(false);
      }
    }

    // 3. Build Store
    async function buildStore() {
      const blueprintText = document.getElementById("blueprintView").value.trim();
      const prompt = document.getElementById("promptInput").value.trim();
      const apiKey = getApiKey();

      if (!blueprintText) {
        alert("يرجى إعداد المخطط الهيكلي أولاً.");
        return;
      }

      setLoader(true, "جارٍ برمجة وتشييد المتجر بالكامل عند الحافة...");
      document.getElementById("analysisStatus").innerText = "جارٍ التشييد والبرمجة...";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            ...(apiKey ? { "X-Custom-API-Key": apiKey } : {})
          },
          body: JSON.stringify({
            prompt: prompt || "قم ببناء المتجر بناءً على المخطط المرفق مع الحفاظ على كافة معايير الجودة والخفة.",
            blueprint: JSON.parse(blueprintText),
            embeddedAssets: uploadedImages.map(i => i.base64)
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "فشل تشييد المتجر");

        currentHtmlCode = data.code || "";
        document.getElementById("codeView").value = currentHtmlCode;
        
        const frame = document.getElementById("liveFrame");
        frame.srcdoc = currentHtmlCode;
        switchTab('preview');

        logMessage("🚀 اكتمل تشييد المتجر", "تم بناء الكود بالكامل بنمط Zero-Bloat وهو يعمل الآن في المعاينة الحية.");
        document.getElementById("analysisStatus").innerText = "تم النشر في المعاينة";
      } catch (err) {
        alert("خطأ التشييد: " + err.message);
        document.getElementById("analysisStatus").innerText = "فشل التشييد";
      } finally {
        setLoader(false);
      }
    }

    function downloadCode() {
      if (!currentHtmlCode) {
        alert("لا يوجد كود منشأ حالياً لتحميله.");
        return;
      }
      const blob = new Blob([currentHtmlCode], { type: "text/html;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "index.html";
      a.click();
    }
  </script>
</body>
</html>
