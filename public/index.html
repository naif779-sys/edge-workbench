<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة Edge Workbench | تشييد المتاجر عند الحافة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 font-bold text-lg">
        ⚡
      </div>
      <div>
        <h1 class="text-base font-bold text-white leading-none">Edge Workbench</h1>
        <p class="text-xs text-slate-400 mt-0.5">محرك بناء المتاجر الفوري عند الحافة</p>
      </div>
    </div>

    <!-- API Key Input -->
    <div class="flex items-center gap-2">
      <input type="password" id="customApiKey" placeholder="مفتاح OpenRouter (يُحفظ تلقائياً)" 
             onchange="saveApiKey(this.value)"
             class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500/50 w-48 md:w-64 transition">
      <span id="statusBadge" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> جاهز
      </span>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 p-4 max-w-[1800px] w-full mx-auto">
    
    <!-- Control & Blueprint Panel -->
    <section class="lg:col-span-5 flex flex-col gap-4">
      
      <!-- Prompt & Image Controls Box -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col gap-3 shadow-sm">
        <div class="flex items-center justify-between">
          <label class="text-sm font-bold text-slate-200 flex items-center gap-2">
            <span>📝</span> متطلبات المتجر والتصميم
          </label>
          <span class="text-[11px] text-slate-400">يدعم ضغط الصور التلقائي</span>
        </div>

        <textarea id="promptInput" rows="3" 
                  placeholder="اكتب وصف المتجر هنا أو ارفع صوراً لتضمينها أو تحليلها..."
                  class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 custom-scroll resize-none"></textarea>
        
        <!-- Image Upload Dropzone -->
        <div class="border border-dashed border-slate-800 rounded-lg p-3 bg-slate-950/50 flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
              <span>🖼️</span> إرفاق الصور
            </span>
            <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-2.5 py-1 rounded border border-slate-700 transition">
              اختيار ملفات
              <input type="file" id="imageInput" multiple accept="image/*" class="hidden" onchange="handleImageSelection(event)">
            </label>
          </div>
          
          <!-- Image Thumbnails Container -->
          <div id="imagePreviewContainer" class="flex gap-2 overflow-x-auto py-1 custom-scroll hidden"></div>
        </div>

        <!-- Action Buttons Grid -->
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button id="btnReadImage" onclick="analyzeAndPlan()" 
                  class="bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white font-bold py-2 px-3 rounded-lg text-xs transition flex items-center justify-center gap-1.5">
            <span>👁️</span> قراءة وتحليل النموذج
          </button>
          
          <button id="btnPlan" onclick="generateBlueprint()" 
                  class="bg-amber-600 hover:bg-amber-500 active:bg-amber-700 text-slate-950 font-bold py-2 px-3 rounded-lg text-xs transition flex items-center justify-center gap-1.5">
            <span>⚙️</span> توليد المخطط الهيكلي
          </button>
        </div>
      </div>

      <!-- Blueprint Editor / HITL -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex-1 flex flex-col gap-3 min-h-[280px] shadow-sm">
        <div class="flex items-center justify-between">
          <label class="text-sm font-bold text-slate-200 flex items-center gap-2">
            <span>📐</span> المخطط الهيكلي (JSON Blueprint)
          </label>
          <button onclick="clearBlueprint()" class="text-xs text-slate-400 hover:text-rose-400 transition">مسح</button>
        </div>
        
        <textarea id="blueprintOutput" 
                  placeholder="سيظهر المخطط الهيكلي هنا بصيغة JSON..." 
                  class="w-full flex-1 bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs font-mono text-emerald-400 placeholder-slate-600 focus:outline-none focus:border-emerald-500 custom-scroll resize-none"></textarea>
        
        <button id="btnBuild" onclick="buildStore()" disabled
                class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold py-2.5 px-4 rounded-lg text-sm transition flex items-center justify-center gap-2">
          <span>🚀</span> تشييد وبرمجة المتجر بالكامل
        </button>
      </div>
    </section>

    <!-- Live Preview & Code Panel -->
    <section class="lg:col-span-7 flex flex-col bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-sm">
      <div class="bg-slate-900/90 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <button id="tabPreview" onclick="switchTab('preview')" class="px-3 py-1 rounded text-xs font-bold bg-slate-800 text-white">معاينة حية</button>
          <button id="tabCode" onclick="switchTab('code')" class="px-3 py-1 rounded text-xs font-medium text-slate-400 hover:text-white">الكود المصدري</button>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="downloadCode()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1 rounded border border-slate-700 transition flex items-center gap-1">
            📥 تحميل HTML
          </button>
        </div>
      </div>

      <div class="flex-1 relative bg-slate-950 flex flex-col min-h-[480px]">
        <iframe id="liveFrame" class="w-full h-full flex-1 border-none bg-white"></iframe>
        
        <textarea id="codeView" readonly 
                  class="hidden w-full h-full flex-1 bg-slate-950 text-slate-200 font-mono text-xs p-4 focus:outline-none custom-scroll resize-none"></textarea>

        <div id="loadingOverlay" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center gap-3 z-20">
          <div class="w-8 h-8 border-3 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
          <p id="loadingText" class="text-sm font-medium text-slate-300">جارٍ المعالجة...</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    let currentHtmlCode = "";
    let uploadedImages = [];

    document.addEventListener("DOMContentLoaded", () => {
      const savedKey = localStorage.getItem("EDGE_WORKBENCH_API_KEY");
      if (savedKey) document.getElementById("customApiKey").value = savedKey;
    });

    function saveApiKey(key) {
      if (key) localStorage.setItem("EDGE_WORKBENCH_API_KEY", key.trim());
      else localStorage.removeItem("EDGE_WORKBENCH_API_KEY");
    }

    function getApiKey() {
      return document.getElementById("customApiKey").value.trim() || localStorage.getItem("EDGE_WORKBENCH_API_KEY") || "";
    }

    function setLoader(show, text = "") {
      const overlay = document.getElementById("loadingOverlay");
      const label = document.getElementById("loadingText");
      if (show) {
        label.innerText = text;
        overlay.classList.remove("hidden");
      } else {
        overlay.classList.add("hidden");
      }
    }

    function switchTab(tab) {
      const frame = document.getElementById("liveFrame");
      const code = document.getElementById("codeView");
      const tabP = document.getElementById("tabPreview");
      const tabC = document.getElementById("tabCode");

      if (tab === 'preview') {
        frame.classList.remove("hidden");
        code.classList.add("hidden");
        tabP.className = "px-3 py-1 rounded text-xs font-bold bg-slate-800 text-white";
        tabC.className = "px-3 py-1 rounded text-xs font-medium text-slate-400 hover:text-white";
      } else {
        frame.classList.add("hidden");
        code.classList.remove("hidden");
        tabC.className = "px-3 py-1 rounded text-xs font-bold bg-slate-800 text-white";
        tabP.className = "px-3 py-1 rounded text-xs font-medium text-slate-400 hover:text-white";
      }
    }

    // High performance client-side image compressor
    function compressImage(file, maxWidth = 1024, quality = 0.7) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
        };
      });
    }

    async function handleImageSelection(event) {
      const files = event.target.files;
      if (!files.length) return;

      const container = document.getElementById("imagePreviewContainer");
      container.classList.remove("hidden");

      for (let file of Array.from(files)) {
        const compressedBase64 = await compressImage(file, 1024, 0.7);
        uploadedImages.push(compressedBase64);

        const thumb = document.createElement("div");
        thumb.className = "relative w-14 h-14 rounded-lg overflow-hidden border border-slate-700 shrink-0";
        thumb.innerHTML = `
          <img src="${compressedBase64}" class="w-full h-full object-cover">
          <button onclick="removeImage(this, '${compressedBase64}')" class="absolute top-0.5 right-0.5 bg-rose-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px] leading-none">×</button>
        `;
        container.appendChild(thumb);
      }
    }

    function removeImage(btn, base64) {
      btn.parentElement.remove();
      uploadedImages = uploadedImages.filter(img => img !== base64);
      if (uploadedImages.length === 0) {
        document.getElementById("imagePreviewContainer").classList.add("hidden");
      }
    }

    function clearBlueprint() {
      document.getElementById("blueprintOutput").value = "";
      document.getElementById("btnBuild").disabled = true;
    }

    async function generateBlueprint() {
      const prompt = document.getElementById("promptInput").value.trim();
      const apiKey = getApiKey();

      if (!prompt && uploadedImages.length === 0) {
        alert("يرجى إدخال وصف المتجر أو إرفاق صور.");
        return;
      }

      setLoader(true, "جارٍ توليد المخطط الهيكلي (Blueprint)...");

      try {
        const res = await fetch("/api/plan", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            ...(apiKey ? { "X-Custom-API-Key": apiKey } : {})
          },
          body: JSON.stringify({ prompt: prompt || "متجر إلكتروني متكامل" })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "فشل توليد المخطط");

        document.getElementById("blueprintOutput").value = JSON.stringify(data.blueprint, null, 2);
        document.getElementById("btnBuild").disabled = false;
      } catch (err) {
        alert("خطأ: " + err.message);
      } finally {
        setLoader(false);
      }
    }

    async function analyzeAndPlan() {
      const apiKey = getApiKey();
      const prompt = document.getElementById("promptInput").value.trim();

      if (uploadedImages.length === 0) {
        alert("يرجى اختيار صورة النموذج أو التصميم أولاً لقراءتها.");
        return;
      }

      setLoader(true, "جارٍ فحص وتحليل الصورة بصرياً وصياغة تصميم مطابق...");

      try {
        const res = await fetch("/api/consult", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            ...(apiKey ? { "X-Custom-API-Key": apiKey } : {})
          },
          body: JSON.stringify({ 
            prompt: prompt || "قم بتحليل هذا النموذج بدقة واستخرج مخطط هيكلي JSON كامل يحاكي ألوانه وأقسامه.",
            images: uploadedImages
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "فشل التحليل البصري");

        document.getElementById("blueprintOutput").value = JSON.stringify(data.blueprint, null, 2);
        document.getElementById("btnBuild").disabled = false;
      } catch (err) {
        alert("خطأ في القراءة البصرية: " + err.message);
      } finally {
        setLoader(false);
      }
    }

    async function buildStore() {
      const blueprintText = document.getElementById("blueprintOutput").value.trim();
      const prompt = document.getElementById("promptInput").value.trim();
      const apiKey = getApiKey();

      if (!blueprintText) {
        alert("يرجى إعداد المخطط الهيكلي أولاً.");
        return;
      }

      setLoader(true, "جارٍ تشييد المتجر بالكامل...");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            ...(apiKey ? { "X-Custom-API-Key": apiKey } : {})
          },
          body: JSON.stringify({
            prompt: prompt || "قم ببناء المتجر بناءً على المخطط المرفق",
            blueprint: JSON.parse(blueprintText)
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "فشل تشييد المتجر");

        currentHtmlCode = data.code || "";
        document.getElementById("codeView").value = currentHtmlCode;
        
        const frame = document.getElementById("liveFrame");
        frame.srcdoc = currentHtmlCode;
        switchTab('preview');
      } catch (err) {
        alert("خطأ التشييد: " + err.message);
      } finally {
        setLoader(false);
      }
    }

    function downloadCode() {
      if (!currentHtmlCode) {
        alert("لا يوجد كود منشأ حالياً لتحميله.");
        return;
      }
      const blob = new Blob([currentHtmlCode], { type: "text/html;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "index.html";
      a.click();
    }
  </script>
</body>
</html>
